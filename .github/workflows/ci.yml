name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint y build comparten la preparación (checkout, Node y npm ci), así que se definen como
  # entradas de una misma matriz. El nombre de cada job se mantiene (`lint (frontend)`,
  # `lint (backend)`, `build (frontend)`) porque la protección de `main` exige esos checks.
  # Al no depender unos de otros, los tres se ejecutan en paralelo.
  ci:
    name: ${{ matrix.tarea }} (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tarea: lint
            app: frontend
          - tarea: lint
            app: backend
          - tarea: build
            app: frontend
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.tarea == 'lint'
        run: npm run lint
      - if: matrix.tarea == 'lint'
        run: npm run format:check
      - if: matrix.tarea == 'build'
        run: npm run build
      - if: matrix.tarea == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
